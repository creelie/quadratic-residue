name: Remove release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the release to delete"
        required: true

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the GitHub release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
